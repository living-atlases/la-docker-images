schemaVersion: 2.0.0

# Only assertions that hold for EVERY java image belong here. metadataTest
# compares labels, cmd and entrypoint literally -- not as regexes -- so anything
# whose value varies per service (image.title, image.version, the CMD) has to go
# in build/<service>/container-test.yaml or in run-container-tests.sh instead.
metadataTest:
  envVars:
    - key: JAVA_HOME
      value: '/opt/java/openjdk'

fileExistenceTests:
  - name: 'Java binary exists'
    path: '/opt/java/openjdk/bin/java'
    shouldExist: true
    permissions: '-rwxr-xr-x'

commandTests:
  # Not metadataTest.user: that field is a Go RE2 regex, and RE2 has no negative
  # lookahead, so the '(?!root)' this used to carry could never match anything.
  - name: 'Container does not run as root'
    command: 'id'
    args: ['-un']
    excludedOutput: ['^root$']
    exitCode: 0

  - name: 'Java version check'
    command: 'java'
    args: ['-version']
    exitCode: 0

  - name: 'Java can allocate heap memory'
    command: 'java'
    args: ['-Xmx512m', '-version']
    exitCode: 0

  - name: 'Curl installed for healthchecks'
    command: 'which'
    args: ['curl']
    exitCode: 0

  - name: 'Grep installed for logs'
    command: 'which'
    args: ['grep']
    exitCode: 0

# The gh-3 guard (JAVA_OPTS must expand at container start, not be baked into
# the CMD at build time) is NOT here. commandTests run their own command inside
# the container and never touch the image's CMD, so any test written that way
# passes just as green against the broken templates. metadataTest.cmd does read
# the real CMD, but it matches exactly -- no regex, verified against the vendored
# binary -- and every service has a different CMD, so it cannot live in a file
# shared by all images.
#
# It lives in scripts/run-container-tests.sh instead, which inspects the CMD with
# `docker inspect` and then runs the image with an overridden JAVA_OPTS. The
# template that produces the CMD is guarded without Docker by
# scripts/test-dockerfile-generation.py.
